name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: instalar dependências
        run: pip install -r requirements.txt

      - name: suíte de testes
        # Constrói o banco sintético do zero, passa pelo caminho de
        # ingestão inteiro e exige que o estimador recupere o efeito
        # plantado. Nenhum dado do TSE é baixado aqui.
        run: python -m pytest -q

      - name: pipeline ponta a ponta em dados sintéticos
        run: python -m python.run_pipeline --sintetico --municipios 60
